baseURL = "https://hwan-yeong.github.io/"
languageCode = "ko-kr"
title = "오늘의 배당·시황 노트"
theme = "PaperMod"
enableRobotsTXT = true
enableEmoji = true

[pagination]
  pagerSize = 10

[params]
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowToc = true

  [params.homeInfoParams]
    Title = "오늘의 배당·시황 노트 📈"
    Content = "배당과 시황을 초보도 이해하기 쉽게 정리하는 투자 노트입니다."

[[menu.main]]
  identifier = "posts"
  name = "글 목록"
  url = "/posts/"
  weight = 10

[[menu.main]]
  identifier = "tags"
  name = "태그"
  url = "/tags/"
  weight = 20

[markup.goldmark.renderer]
  unsafe = true
